name: Recover stalled Pages publication

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force cancel the two superseded Pages attempts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 43095008326 43096018143; do
            code=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel")
            echo "Superseded Pages run $run_id: HTTP $code"
            if [[ "$code" != "202" && "$code" != "409" ]]; then
              cat response.json
              exit 1
            fi
          done
