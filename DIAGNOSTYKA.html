<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostyka modelu — PUSH-UP HERO</title><body style="font:18px/1.6 system-ui;max-width:700px;margin:40px auto;padding:20px"><h1>Test modelu kamery</h1><p>Test pobiera bibliotekę i model, uruchamia analizę pustego obrazu. Nie włącza kamery i nie sprawdza dokładności liczenia pompek.</p><button id="run" style="padding:16px">Sprawdź model</button><p id="result" role="status">Gotowy.</p><a href="./">Wróć do gry</a><script type="module">
document.getElementById('run').onclick=async()=>{const r=document.getElementById('result'),b=document.getElementById('run');b.disabled=true;r.textContent='Pobieranie biblioteki i modelu…';let model;try{const {FilesetResolver,PoseLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');model=await PoseLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'VIDEO',numPoses:1});const c=document.createElement('canvas');c.width=640;c.height=480;c.getContext('2d').fillRect(0,0,640,480);const data=model.detectForVideo(c,performance.now());r.textContent='OK: biblioteka, WASM, model i analiza obrazu działają. Sylwetki na pustym obrazie: '+data.landmarks.length+'. To nie jest test fizycznej kamery.';}catch(e){r.textContent='Błąd: '+e.message;}finally{model?.close();b.disabled=false;}};
</script></body></html>
